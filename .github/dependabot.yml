version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    # Avoid no-op edits when a docs requirement already admits the newest
    # Python-compatible release (Dependabot's requirement replacer can fail).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
