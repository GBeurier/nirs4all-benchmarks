name: pages

# Deploy only the data-free unavailable-results page to the existing Arena site.
# Scientific result publication remains closed; Root owns manual dispatch.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.11
      - name: Install
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv -e .
      - name: Build unavailable-results page without a store or history
        run: .venv/bin/n4a-benchmarks build-site --unavailable-results --out ./site --domain benchmarks.nirs4all.org
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
