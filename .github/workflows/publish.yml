name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = build only (no publish)"
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Build shared ranking frontend
        run: npm ci && npm run build:frontend
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Refuse the results data pack in any distribution
        run: |
          python - <<'EOF'
          import glob, tarfile, zipfile
          bad = []
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as archive:
                  for name in archive.getnames():
                      relative = name.split("/", 1)[-1]  # drop the "<project>-<version>/" root
                      if relative.startswith("data/") or name.endswith("runs.jsonl.gz"):
                          bad.append(f"{path}: {name}")
          for path in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(path) as archive:
                  bad += [f"{path}: {n}" for n in archive.namelist() if "catalog-history" in n or n.endswith("runs.jsonl.gz")]
          assert glob.glob("dist/*.tar.gz") and glob.glob("dist/*.whl"), "expected one sdist and one wheel"
          if bad:
              raise SystemExit("results data pack must not ship on PyPI:\n" + "\n".join(bad))
          EOF
      - name: Smoke-check the wheel
        run: |
          python -m pip install dist/*.whl
          n4a-benchmarks --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.dry_run == 'false'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Validate Trusted Publisher release tuple
        run: |
          set -euo pipefail
          expected_repo="GBeurier/nirs4all-benchmarks"
          if [[ "${GITHUB_REPOSITORY}" != "${expected_repo}" ]]; then
            echo "::error::PyPI Trusted Publisher for project nirs4all-benchmarks must target owner=GBeurier repo=nirs4all-benchmarks workflow=publish.yml environment=pypi; current repository is ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            */.github/workflows/publish.yml@*)
              ;;
            *)
              echo "::error::Expected GITHUB_WORKFLOW_REF to point at .github/workflows/publish.yml, got ${GITHUB_WORKFLOW_REF}." >&2
              exit 1
              ;;
          esac
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
