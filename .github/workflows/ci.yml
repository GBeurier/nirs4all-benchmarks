name: CI

on:
  push:
    branches: [main, rc/**]
  pull_request:
    branches: [main, rc/**]

jobs:
  green-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv -e ".[service,dev]" pytest-cov

      - name: Ruff (lint)
        run: .venv/bin/ruff check src tests

      - name: Mypy (types)
        run: .venv/bin/mypy --python-version ${{ matrix.python-version }}

      - name: Pytest (with coverage)
        run: .venv/bin/python -m pytest -q --cov=nirs4all_benchmarks --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Build and test shared ranking island
        run: npm ci && npm run test:frontend && npm run build:frontend
      - name: node --check every SPA module
        run: |
          set -e
          for f in src/nirs4all_benchmarks/web/app.js \
                   src/nirs4all_benchmarks/web/lib/*.js \
                   src/nirs4all_benchmarks/web/views/*.js; do
            cp "$f" "${f%.js}.__check.mjs"
            node --check "${f%.js}.__check.mjs"
            rm "${f%.js}.__check.mjs"
            echo "ok: $f"
          done

  docker:
    runs-on: ubuntu-latest
    needs: green-gate
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t nirs4all-benchmarks:ci .
      - name: Smoke test
        run: |
          # Health refuses uninitialized/v1 volumes. This CI-only anonymous volume
          # is explicitly initialized empty; no dataset/run or migration is seeded.
          docker run -d --name arena -p 8000:8000 nirs4all-benchmarks:ci \
            /bin/sh -c 'n4a-benchmarks init --store /data/arena-store && exec uvicorn --factory nirs4all_benchmarks.service.app:create_app --host 0.0.0.0 --port 8000'
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/healthz; then echo " up"; exit 0; fi
            sleep 1
          done
          docker logs arena; exit 1
